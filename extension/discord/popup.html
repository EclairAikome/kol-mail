<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KOL Mail Discord 私信助手</title>
  <style>
    :root { color-scheme: light dark; --fg:#1f2328; --muted:#5c6370; --line:#d0d4da; --bg:#ffffff; --accent:#5865f2;
            --ok:#1f8a4c; --err:#c62f33; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e3e5e8; --muted:#9aa0a8; --line:#3f4147; --bg:#1e1f22; --ok:#3ccf7c; --err:#ff6b6e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; padding: 14px 16px 16px; background: var(--bg); color: var(--fg);
           font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 10px 0 4px; color: var(--muted); }
    input { width: 100%; padding: 6px 8px; font: inherit; color: var(--fg); background: transparent;
            border: 1px solid var(--line); border-radius: 6px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { margin-top: 14px; width: 100%; padding: 7px; font: inherit; color: #fff; background: var(--accent);
             border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 10px; min-height: 20px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    .note { margin-top: 12px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>KOL Mail Discord 私信助手</h1>
  <label for="token">令牌（KOL Mail 设置 → 私信渠道 里复制）</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <label for="port">端口（一般不用改）</label>
  <input id="port" type="number" min="1" max="65535" placeholder="8765">
  <button id="save">保存并测试连接</button>
  <div id="status"></div>
  <div class="note">扩展只读你正在看的 Discord 私信，只往输入框里填字。发送由你自己按回车。</div>
  <script src="popup.js"></script>
</body>
</html>
